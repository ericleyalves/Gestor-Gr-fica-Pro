<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aprovação de orçamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --brand: #6C2BFF; --ok: #059669; --warn: #B45309; --text: #16131F; --muted: #6B6880; --line: #E7E5F0; --bg: #F5F4FA; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 110px; }
  header { background: var(--brand); color: #fff; padding: 18px 16px; display: flex; align-items: center; gap: 12px; }
  header img { height: 42px; max-width: 120px; object-fit: contain; background: #fff; border-radius: 10px; padding: 4px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 800; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .total b { font-size: 22px; color: var(--brand); }
  .muted { color: var(--muted); font-size: 13px; }
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .doc-inner { width: 820px; transform-origin: 0 0; }
  iframe { width: 820px; border: 0; display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
  button, .btn { font: inherit; font-weight: 800; font-size: 15px; border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-ok { background: var(--ok); color: #fff; flex: 1; max-width: 340px; }
  .btn-alt { background: #fff; color: var(--text); border: 1.5px solid var(--line); }
  .btn-wa { background: #25D366; color: #fff; }
  .state { text-align: center; padding: 28px 16px; }
  .state .ic { font-size: 44px; }
  .state h2 { margin: 8px 0 4px; font-size: 20px; }
  .modal { position: fixed; inset: 0; background: rgba(10,10,20,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { .modal { align-items: center; } .sheet { border-radius: 20px; } }
  label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .row button { flex: 1; }
  .err { color: #DC2626; font-size: 13px; margin-top: 8px; min-height: 1em; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header id="hd"><div><h1 id="shop">Orçamento</h1><p>Confira e aprove o seu orçamento</p></div></header>
<main id="main"><div class="card state"><div class="ic">⏳</div><p class="muted">Carregando orçamento…</p></div></main>
<div class="bar hidden" id="bar">
  <button class="btn-alt" id="b-alt">✏️ Pedir alteração</button>
  <button class="btn-ok" id="b-ok">✅ Aprovar orçamento</button>
</div>
<div class="modal hidden" id="modal"><div class="sheet">
  <h2 id="m-title" style="margin:0 0 4px; font-size:19px;"></h2>
  <p id="m-sub" class="muted" style="margin:0;"></p>
  <label for="m-name">Seu nome</label><input id="m-name" maxlength="80" autocomplete="name">
  <label for="m-note" id="m-note-l">Observação (opcional)</label><textarea id="m-note" maxlength="1000"></textarea>
  <div class="err" id="m-err"></div>
  <div class="row"><button class="btn-alt" id="m-cancel">Voltar</button><button class="btn-ok" id="m-send">Confirmar</button></div>
</div></div>

<script>
(() => {
  'use strict';
  const SUPABASE_URL = 'https://lcfzdammuehwnclywuhp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g20FE0UERlssSI48Pswv2A_qPghVpQC';
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const fmtD = (iso) => { const [y, m, d] = String(iso || '').slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : ''; };
  const digits = (s) => String(s || '').replace(/\D/g, '');
  let Q = null, action = null;

  const rpc = async (fn, body) => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  const waLink = (text) => {
    const p = digits(Q?.data?.shopPhone);
    if (!p) return '';
    return `https://wa.me/${p.length <= 11 ? '55' + p : p}?text=${encodeURIComponent(text)}`;
  };

  const state = (ic, title, text, extra = '') => {
    $('main').innerHTML = `<div class="card state"><div class="ic">${ic}</div><h2>${esc(title)}</h2><p class="muted">${text}</p>${extra}</div>` + ($('main').dataset.doc || '');
    if (Q) mountDoc();
  };

  const mountDoc = () => {
    const wrap = $('doc'); if (!wrap) return;
    const frame = wrap.querySelector('iframe');
    frame.srcdoc = Q.data.html;
    const fit = () => {
      const doc = frame.contentDocument; if (!doc?.body) return;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      frame.style.height = h + 'px';
      const s = Math.min(1, wrap.clientWidth / 820);
      wrap.firstElementChild.style.transform = `scale(${s})`;
      wrap.style.height = (h * s) + 'px';
    };
    frame.onload = () => { fit(); setTimeout(fit, 600); setTimeout(fit, 2000); };
    addEventListener('resize', fit);
  };

  const docBlock = () => `<div class="doc" id="doc"><div class="doc-inner"><iframe title="Orçamento" sandbox="allow-same-origin"></iframe></div></div>`;

  const render = () => {
    const d = Q.data || {};
    document.documentElement.style.setProperty('--brand', /^#[0-9a-f]{6}$/i.test(d.brandColor || '') ? d.brandColor : '#6C2BFF');
    document.title = `Orçamento Nº ${d.number} — ${d.shopName || ''}`;
    $('shop').textContent = d.shopName || 'Orçamento';
    if (d.logo && /^https:\/\//.test(d.logo)) $('hd').insertAdjacentHTML('afterbegin', `<img src="${esc(d.logo)}" alt="">`);
    const expired = d.validUntil && d.validUntil < new Date(Date.now() - 3 * 3600000).toISOString().slice(0, 10);
    const head = `<div class="card total"><div><div class="muted">Orçamento Nº ${esc(d.number)} · ${esc(d.customer)}</div>
        <div class="muted">Válido até ${fmtD(d.validUntil)}</div></div><b>${brl(d.total)}</b></div>`;
    $('main').dataset.doc = docBlock();
    const talk = waLink(`Olá! Sobre o orçamento Nº ${d.number}:`);
    const talkBtn = talk ? `<p><a class="btn btn-wa" href="${esc(talk)}" target="_blank" rel="noopener">Falar no WhatsApp</a></p>` : '';

    if (Q.status === 'Aprovado') {
      state('✅', 'Orçamento aprovado!', `Aprovado por <b>${esc(Q.client_name)}</b> em ${fmtD(Q.responded_at)}. Obrigado! Já vamos dar andamento.`, talkBtn);
    } else if (Q.status === 'Alteração') {
      state('✏️', 'Alteração solicitada', `Recebemos seu pedido de ajuste${Q.client_note ? `: “${esc(Q.client_note)}”` : ''}. Em breve enviamos o orçamento atualizado.`, talkBtn);
    } else if (expired) {
      state('⌛', 'Este orçamento venceu', 'A validade terminou. Fale com a gente para receber um orçamento atualizado.', talkBtn);
    } else {
      $('main').innerHTML = head + docBlock();
      mountDoc();
      $('bar').classList.remove('hidden');
    }
  };

  const openModal = (act) => {
    action = act;
    $('m-title').textContent = act === 'aprovar' ? 'Aprovar orçamento' : 'Pedir alteração';
    $('m-sub').textContent = act === 'aprovar' ? `Total de ${brl(Q.data.total)}. Ao confirmar, a gráfica é avisada para dar andamento.` : 'Conte o que deseja mudar (quantidade, tamanho, cor, arte…).';
    $('m-note-l').textContent = act === 'aprovar' ? 'Observação (opcional)' : 'O que deseja alterar?';
    $('m-name').value = $('m-name').value || Q.data.customer || '';
    $('m-err').textContent = '';
    $('modal').classList.remove('hidden');
    (act === 'aprovar' ? $('m-name') : $('m-note')).focus();
  };

  $('b-ok').onclick = () => openModal('aprovar');
  $('b-alt').onclick = () => openModal('alterar');
  $('m-cancel').onclick = () => $('modal').classList.add('hidden');
  $('modal').onclick = (e) => { if (e.target.id === 'modal') $('modal').classList.add('hidden'); };
  $('m-send').onclick = async () => {
    const name = $('m-name').value.trim(), note = $('m-note').value.trim();
    if (!name) return ($('m-err').textContent = 'Informe seu nome.');
    if (action === 'alterar' && !note) return ($('m-err').textContent = 'Descreva a alteração desejada.');
    const btn = $('m-send'); btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const r = await rpc('respond_public_quote', { p_token: token, p_action: action, p_name: name, p_note: note });
      if (!r.ok) {
        const msg = { expired: 'A validade deste orçamento terminou.', already: 'Este orçamento já foi respondido.', name: 'Informe seu nome.' }[r.error] || 'Não foi possível enviar.';
        $('m-err').textContent = msg; btn.disabled = false; btn.textContent = 'Confirmar'; return;
      }
      Object.assign(Q, { status: r.status, client_name: name, client_note: note, responded_at: new Date().toISOString() });
      $('modal').classList.add('hidden'); $('bar').classList.add('hidden');
      render(); scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      $('m-err').textContent = 'Sem conexão. Tente de novo em instantes.';
      btn.disabled = false; btn.textContent = 'Confirmar';
    }
  };

  (async () => {
    if (token.length < 24) return state('🔗', 'Link inválido', 'Confira se o link foi copiado inteiro.');
    try {
      Q = await rpc('get_public_quote', { p_token: token });
      if (!Q) { Q = null; return state('🔍', 'Orçamento não encontrado', 'Este link não existe mais. Peça um novo à gráfica.'); }
      render();
    } catch (e) {
      state('📶', 'Não foi possível carregar', 'Verifique sua internet e tente de novo em instantes.', '<p><button class="btn-alt" onclick="location.reload()">Tentar de novo</button></p>');
    }
  })();
})();
</script>
</body>
</html>
