<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de produtos personalizados</title>
<meta name="description" content="Produtos personalizados em MDF e acrílico: corte a laser e impressão UV. Peça seu orçamento pelo WhatsApp.">
<meta property="og:title" content="Catálogo de produtos personalizados">
<meta property="og:description" content="Escolha o produto e peça seu orçamento pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --brand: #6C2BFF; --brand2: #EC0C7C; --text: #16131F; --muted: #6B6880; --line: #E7E5F0; --bg: #F5F4FA; --wa: #25D366; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 96px; }
  header { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; padding: 22px 16px 54px; }
  .head-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  header img { height: 56px; width: 56px; object-fit: contain; background: #fff; border-radius: 14px; padding: 5px; flex-shrink: 0; }
  header h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; }
  header p { margin: 3px 0 0; font-size: 13px; opacity: .9; }
  main { max-width: 1100px; margin: -38px auto 0; padding: 0 16px; }
  .search { background: #fff; border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-shadow: 0 8px 24px rgba(20,10,60,.08); }
  .search input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; padding: 14px 0; background: transparent; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,10,60,.08); }
  .ph { aspect-ratio: 1 / 1; background: #EEEAF8; display: flex; align-items: center; justify-content: center; color: #B9B3D1; font-size: 34px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cat { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .name { font-size: 14px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { font-size: 13px; color: var(--muted); margin-top: auto; }
  .price b { color: var(--brand); font-size: 15px; }
  .ask { margin-top: 8px; background: var(--wa); color: #fff; border: 0; border-radius: 10px; padding: 9px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .empty, .state { text-align: center; color: var(--muted); padding: 40px 16px; }
  .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--wa); color: #fff; text-decoration: none; font-weight: 800; border-radius: 999px; padding: 14px 18px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px rgba(0,0,0,.18); z-index: 5; }
  .fab svg { width: 22px; height: 22px; }
  footer { max-width: 1100px; margin: 28px auto 0; padding: 0 16px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  footer a { color: var(--brand); font-weight: 700; text-decoration: none; }
  .modal { position: fixed; inset: 0; background: rgba(10,10,20,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: #fff; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .modal { align-items: center; } .sheet { border-radius: 22px; } }
  .gal { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #EEEAF8; scrollbar-width: none; }
  .gal::-webkit-scrollbar { display: none; }
  .gal img { width: 100%; flex-shrink: 0; aspect-ratio: 1 / 1; object-fit: cover; scroll-snap-align: center; }
  .dots { display: flex; justify-content: center; gap: 5px; margin-top: -22px; position: relative; padding-bottom: 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.6); }
  .sheet .body { padding: 16px; }
  .sheet h2 { margin: 4px 0 6px; font-size: 20px; line-height: 1.25; }
  .x { position: absolute; margin: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); font-size: 20px; cursor: pointer; }
  label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; }
  select, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  .tiers { margin-top: 12px; background: #F3F0FF; border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .tiers > b { font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .tiers span b { color: var(--brand); }
  .go { width: 100%; margin-top: 16px; background: var(--wa); color: #fff; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<header><div class="head-in" id="head"><div><h1>Catálogo</h1><p>Carregando…</p></div></div></header>
<main>
  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A95B3" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar produto…" autocomplete="off" aria-label="Buscar produto">
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div id="state" class="state">Carregando catálogo…</div>
</main>
<footer id="foot"></footer>
<a id="fab" class="fab" href="#" target="_blank" rel="noopener" hidden>
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
  Fale conosco
</a>
<script>
(() => {
  // Chave PÚBLICA (publishable): só lê a cópia pública do catálogo (supabase-catalogo.sql)
  const SUPABASE_URL = 'https://lcfzdammuehwnclywuhp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g20FE0UERlssSI48Pswv2A_qPghVpQC';
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
  const brl = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const digits = (s) => String(s || '').replace(/\D/g, '');
  let C = null, cat = 'Todos', term = '';

  const waNumber = () => { let d = digits(C?.shop?.phone).replace(/^0+/, ''); if (d.length === 10 || d.length === 11) d = '55' + d; return d.length >= 12 ? d : ''; };
  const waLink = (text) => `https://wa.me/${waNumber()}?text=${encodeURIComponent(text)}`;
  const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const askText = (p, chosen = [], note = '') => {
    let t = `Olá! Vi no catálogo e quero um orçamento de:\n*${p.name}*`;
    chosen.filter(([, v]) => v).forEach(([k, v]) => { t += `\n${k}: ${v}`; });
    if (note.trim()) t += `\nObs.: ${note.trim()}`;
    return t;
  };

  const renderHead = () => {
    const s = C.shop || {};
    document.documentElement.style.setProperty('--brand', s.color || '#6C2BFF');
    document.documentElement.style.setProperty('--brand2', s.color2 || s.color || '#6C2BFF');
    const title = s.name ? `Catálogo · ${s.name}` : 'Catálogo de produtos';
    document.title = title;
    $('head').innerHTML = `${s.logo ? `<img src="${esc(s.logo)}" alt="">` : ''}
      <div><h1>${esc(s.name || 'Catálogo')}</h1><p>Personalizados sob medida · escolha e peça seu orçamento</p></div>`;
    const ig = String(s.instagram || '').replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/$/, '');
    $('foot').innerHTML = [s.address && esc(s.address), ig && `<a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>`,
      C.updatedAt && `Atualizado em ${new Date(C.updatedAt).toLocaleDateString('pt-BR')}`].filter(Boolean).join('<br>');
    if (waNumber()) { $('fab').hidden = false; $('fab').href = waLink(`Olá! Vi o catálogo${s.name ? ` da ${s.name}` : ''} e queria um orçamento.`); }
  };

  const renderChips = () => {
    const cats = ['Todos', ...new Set(C.products.map(p => p.category))];
    $('chips').innerHTML = cats.length > 2 ? cats.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('') : '';
  };

  const renderGrid = () => {
    const t = norm(term);
    const list = C.products.filter(p => (cat === 'Todos' || p.category === cat) && (!t || norm(`${p.name} ${p.category}`).includes(t)));
    $('grid').innerHTML = list.map(p => `
      <article class="card" data-id="${esc(p.id)}">
        <div class="ph">${p.images?.[0] ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy">` : '✦'}</div>
        <div class="info">
          <span class="cat">${esc(p.category)}</span>
          <span class="name">${esc(p.name)}</span>
          ${C.showPrices && p.price > 0 ? `<span class="price">a partir de <b>${brl(p.price)}</b></span>` : '<span class="price">Sob orçamento</span>'}
          ${C.showPrices && p.tiers?.length ? `<span class="price" style="font-size:11px;">atacado: ${p.tiers[p.tiers.length - 1].minQty}+ un ${brl(p.tiers[p.tiers.length - 1].price)}</span>` : ''}
          ${waNumber() ? `<button class="ask" data-ask="${esc(p.id)}">Pedir orçamento</button>` : ''}
        </div>
      </article>`).join('');
    $('state').textContent = list.length ? '' : 'Nenhum produto encontrado.';
  };

  const openProduct = (id) => {
    const p = C.products.find(x => x.id === id);
    if (!p) return;
    const m = document.createElement('div');
    m.className = 'modal';
    const imgs = p.images || [];
    m.innerHTML = `
      <div class="sheet" role="dialog" aria-label="${esc(p.name)}">
        <button class="x" data-x aria-label="Fechar">×</button>
        ${imgs.length ? `<div class="gal">${imgs.map(u => `<img src="${esc(u)}" alt="">`).join('')}</div>
          ${imgs.length > 1 ? `<div class="dots">${imgs.map(() => '<i></i>').join('')}</div>` : ''}` : '<div class="ph" style="aspect-ratio:2/1">✦</div>'}
        <div class="body">
          <span class="cat">${esc(p.category)}</span>
          <h2>${esc(p.name)}</h2>
          ${C.showPrices && p.price > 0 ? `<div class="price">a partir de <b>${brl(p.price)}</b></div>` : ''}
          ${C.showPrices && p.tiers?.length ? `<div class="tiers"><b>Preço para lojista / quantidade</b>${p.tiers.map(t => `<span>${t.minQty}+ un <b>${brl(t.price)}</b> / un</span>`).join('')}</div>` : ''}
          ${(p.options || []).map((g, i) => `
            <label for="op${i}">${esc(g.name)}</label>
            <select id="op${i}" data-opt="${esc(g.name)}"><option value="">Escolher…</option>${g.values.map(v => `<option>${esc(v)}</option>`).join('')}</select>`).join('')}
          <label for="note">Quantidade / detalhes (opcional)</label>
          <textarea id="note" placeholder="Ex.: 50 unidades, com o meu logo, para dia 15"></textarea>
          ${waNumber() ? '<button class="go" data-go>Pedir orçamento no WhatsApp</button>' : ''}
        </div>
      </div>`;
    const close = () => m.remove();
    m.addEventListener('click', (e) => {
      if (e.target === m || e.target.closest('[data-x]')) return close();
      if (e.target.closest('[data-go]')) {
        const chosen = [...m.querySelectorAll('[data-opt]')].map(s => [s.dataset.opt, s.value]);
        window.open(waLink(askText(p, chosen, m.querySelector('#note').value)), '_blank', 'noopener');
      }
    });
    document.addEventListener('keydown', function onKey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } });
    document.body.appendChild(m);
  };

  $('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; renderChips(); renderGrid(); });
  $('q').addEventListener('input', (e) => { term = e.target.value; renderGrid(); });
  $('grid').addEventListener('click', (e) => {
    const ask = e.target.closest('[data-ask]');
    if (ask) { e.stopPropagation(); const p = C.products.find(x => x.id === ask.dataset.ask); return window.open(waLink(askText(p)), '_blank', 'noopener'); }
    const card = e.target.closest('[data-id]');
    if (card) openProduct(card.dataset.id);
  });

  (async () => {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/public_catalog?id=eq.main&select=data`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const rows = await r.json();
      C = rows?.[0]?.data;
      if (!C || !Array.isArray(C.products)) { $('state').textContent = 'O catálogo ainda não foi publicado.'; $('head').innerHTML = '<div><h1>Catálogo</h1><p>Em breve</p></div>'; return; }
      renderHead(); renderChips(); renderGrid();
    } catch (e) {
      console.error(e);
      $('state').innerHTML = 'Não foi possível carregar o catálogo agora. <a href="" style="color:var(--brand);font-weight:700">Tentar de novo</a>';
    }
  })();
})();
</script>
</body>
</html>
